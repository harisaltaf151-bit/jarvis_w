<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="J.A.R.V.I.S banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030712"/>
      <stop offset="1" stop-color="#0a1a2f"/>
    </linearGradient>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#22d3ee"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#164e63" stroke-width="0.6" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>

  <!-- scanning line -->
  <rect x="0" y="0" width="1200" height="3" fill="#22d3ee" opacity="0.35">
    <animate attributeName="y" values="0;317;0" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- HUD corner brackets -->
  <g fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <path d="M24 60V24H60"/><path d="M1140 24H1176V60"/>
    <path d="M24 260V296H60"/><path d="M1140 296H1176V260"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </g>

  <!-- arc reactor -->
  <g transform="translate(200 160)">
    <circle r="120" fill="url(#core)" opacity="0.25">
      <animate attributeName="r" values="110;130;110" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="105" fill="none" stroke="#22d3ee" stroke-width="3" stroke-dasharray="14 10" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle r="82" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4 8" opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="10s" repeatCount="indefinite"/>
    </circle>
    <g stroke="#22d3ee" stroke-width="6" stroke-linecap="round" opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
      <line x1="0" y1="-66" x2="0" y2="-50"/>
      <line x1="57" y1="-33" x2="43" y2="-25"/>
      <line x1="57" y1="33" x2="43" y2="25"/>
      <line x1="0" y1="66" x2="0" y2="50"/>
      <line x1="-57" y1="33" x2="-43" y2="25"/>
      <line x1="-57" y1="-33" x2="-43" y2="-25"/>
    </g>
    <circle r="40" fill="#0b1b2e" stroke="#22d3ee" stroke-width="3"/>
    <circle r="24" fill="url(#core)">
      <animate attributeName="r" values="20;28;20" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- text -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="380" y="150" font-size="84" font-weight="800" letter-spacing="4" fill="url(#tg)" opacity="0">J.A.R.V.I.S
      <animate attributeName="opacity" from="0" to="1" dur="1s" fill="freeze"/>
    </text>
    <text x="384" y="196" font-size="24" font-style="italic" fill="#a5f3fc" opacity="0">Just A Rather Very Intelligent System
      <animate attributeName="opacity" from="0" to="1" begin="0.7s" dur="1s" fill="freeze"/>
    </text>
    <text x="384" y="236" font-size="18" fill="#94a3b8" opacity="0">Personal AI Operating System · Voice · Text · Automation
      <animate attributeName="opacity" from="0" to="1" begin="1.3s" dur="1s" fill="freeze"/>
    </text>
    <rect x="384" y="252" height="3" rx="1.5" fill="#22d3ee" width="0">
      <animate attributeName="width" from="0" to="420" begin="1.6s" dur="1.2s" fill="freeze"/>
    </rect>
  </g>
</svg>
