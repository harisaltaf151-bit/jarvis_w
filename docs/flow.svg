<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="How a JARVIS command flows" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030712"/>
      <stop offset="1" stop-color="#0a1a2f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" rx="18" fill="url(#bg)"/>
  <text x="600" y="50" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#e2e8f0">How a command flows</text>

  <!-- forward line -->
  <line x1="125" y1="160" x2="1065" y2="160" stroke="#22d3ee" stroke-width="3" stroke-dasharray="8 8" opacity="0.7">
    <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.2s" repeatCount="indefinite"/>
  </line>
  <!-- return line -->
  <path d="M1065 210 V290 H125 V210" fill="none" stroke="#34d399" stroke-width="3" stroke-dasharray="8 8" opacity="0.6">
    <animate attributeName="stroke-dashoffset" from="0" to="32" dur="1.2s" repeatCount="indefinite"/>
  </path>

  <circle r="7" fill="#fbbf24"><animateMotion dur="4s" repeatCount="indefinite" path="M125 160 H1065"/></circle>
  <circle r="14" fill="#fbbf24" opacity="0.25"><animateMotion dur="4s" repeatCount="indefinite" path="M125 160 H1065"/></circle>
  <circle r="7" fill="#34d399"><animateMotion dur="4s" begin="2s" repeatCount="indefinite" path="M1065 210 V290 H125 V210"/></circle>
  <circle r="14" fill="#34d399" opacity="0.25"><animateMotion dur="4s" begin="2s" repeatCount="indefinite" path="M1065 210 V290 H125 V210"/></circle>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <rect x="30" y="110" width="190" height="100" rx="14" fill="#0b1b2e" stroke="#22d3ee" stroke-width="2"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="4s" begin="0s" repeatCount="indefinite"/></rect>
    <text x="125" y="148" font-size="19" font-weight="700" fill="#f1f5f9">1. HUD UI</text>
    <text x="125" y="173" font-size="13" fill="#94a3b8">ui/index.html</text>
    <text x="125" y="191" font-size="13" fill="#94a3b8">type or speak</text>

    <rect x="265" y="110" width="190" height="100" rx="14" fill="#0b1b2e" stroke="#60a5fa" stroke-width="2"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="4s" begin="0.7s" repeatCount="indefinite"/></rect>
    <text x="360" y="148" font-size="19" font-weight="700" fill="#f1f5f9">2. Server</text>
    <text x="360" y="173" font-size="13" fill="#94a3b8">core/server.py</text>
    <text x="360" y="191" font-size="13" fill="#94a3b8">WebSocket :8765</text>

    <rect x="500" y="110" width="190" height="100" rx="14" fill="#0b1b2e" stroke="#a78bfa" stroke-width="2"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="4s" begin="1.4s" repeatCount="indefinite"/></rect>
    <text x="595" y="148" font-size="19" font-weight="700" fill="#f1f5f9">3. Brain</text>
    <text x="595" y="173" font-size="13" fill="#94a3b8">core/brain.py</text>
    <text x="595" y="191" font-size="13" fill="#94a3b8">Claude → tool call</text>

    <rect x="735" y="110" width="190" height="100" rx="14" fill="#0b1b2e" stroke="#2dd4bf" stroke-width="2"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="4s" begin="2.1s" repeatCount="indefinite"/></rect>
    <text x="830" y="148" font-size="19" font-weight="700" fill="#f1f5f9">4. Dispatch</text>
    <text x="830" y="173" font-size="13" fill="#94a3b8">picks the right</text>
    <text x="830" y="191" font-size="13" fill="#94a3b8">tool / plugin</text>

    <rect x="970" y="110" width="190" height="100" rx="14" fill="#0b1b2e" stroke="#34d399" stroke-width="2"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="4s" begin="2.8s" repeatCount="indefinite"/></rect>
    <text x="1065" y="148" font-size="19" font-weight="700" fill="#f1f5f9">5. Tools</text>
    <text x="1065" y="173" font-size="13" fill="#94a3b8">tools/*.py</text>
    <text x="1065" y="191" font-size="13" fill="#94a3b8">runs the action</text>

    <text x="595" y="318" font-size="14" fill="#34d399">result streams back to the UI</text>
    <text x="600" y="368" font-size="13" fill="#64748b">App · Files · Browser · Email · Calendar · Terminal · Screen · System · Voice · Notify · Clipboard</text>
  </g>
</svg>
